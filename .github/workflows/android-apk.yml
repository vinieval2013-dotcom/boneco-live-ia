name: Gerar APK Android assinado

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar assinatura permanente
        env:
          ANDROID_SIGNING_CONFIG: ${{ secrets.ANDROID_SIGNING_CONFIG }}
        run: |
          if [ -z "$ANDROID_SIGNING_CONFIG" ]; then
            echo "Falta configurar o segredo ANDROID_SIGNING_CONFIG nas configurações do repositório."
            exit 1
          fi
          python3 - <<'PY'
          import os, json, base64
          cfg = json.loads(os.environ["ANDROID_SIGNING_CONFIG"])
          with open("app/boneco-release.jks", "wb") as f:
              f.write(base64.b64decode(cfg["keystoreBase64"]))
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("KEYSTORE_PASSWORD=" + cfg["storePassword"] + "\\n")
              env.write("KEY_PASSWORD=" + cfg["keyPassword"] + "\\n")
              env.write("KEY_ALIAS=" + cfg["keyAlias"] + "\\n")
          PY

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de atualização assinado
        run: gradle assembleRelease --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Boneco-Live-IA-APK-Atualizacao
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
